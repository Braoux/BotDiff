<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">BotDiff — Know the matchup. Play the lane.</title>
<desc id="desc">Stylized opposing ADC and Support duos surrounding a central tactical game plan, with blue and purple accents.</desc>
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101f3c"/><stop offset="1" stop-color="#101127"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58e8f0"/><stop offset="1" stop-color="#4794ef"/></linearGradient>
<linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c28eff"/><stop offset="1" stop-color="#ed6da8"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#2d577b" stop-opacity=".33"/><stop offset="1" stop-color="#11162b" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7da2c5" stroke-opacity=".085"/></pattern>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#background)"/>
<rect width="1200" height="420" rx="22" fill="url(#grid)"/>
<ellipse cx="600" cy="190" rx="425" ry="225" fill="url(#glow)"/>
<path d="M 64 328 H 1136" stroke="#92b2db" stroke-opacity=".18"/>
<path d="M 64 90 H 1136" stroke="#92b2db" stroke-opacity=".13"/>
<text x="600" y="105" fill="#a2c6dc" font-size="17" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="5" text-anchor="middle">FOUR CHAMPIONS. ONE LANE PLAN.</text>
<text x="600" y="213" fill="#f2fbff" font-size="90" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="1" text-anchor="middle">BOTDIFF</text>
<text x="600" y="253" fill="#b9cbdf" font-size="22" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Know the matchup. Play the lane.</text>
<g>
<rect x="70" y="125" width="166" height="171" rx="17" fill="#0c2c43" stroke="#4bd2ef" stroke-opacity=".65"/>
<text x="153" y="153" font-size="14" letter-spacing="2" fill="#7aebfc" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle">YOUR DUO</text>
<circle cx="113" cy="210" r="25" fill="#19465d" stroke="#69e5f0" stroke-width="2"/>
<circle cx="193" cy="210" r="25" fill="#19465d" stroke="#69e5f0" stroke-width="2"/>

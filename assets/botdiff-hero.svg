<text x="193" y="216" font-size="14" fill="#d0f9ff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">SUP</text>
<path d="M113 252 L113 266 M193 252 L193 266" stroke="#69e5f0" stroke-width="3" stroke-linecap="round"/>
</g>
<g>
<rect x="964" y="125" width="166" height="171" rx="17" fill="#33203e" stroke="#ce89f1" stroke-opacity=".65"/>
<text x="1047" y="153" font-size="14" letter-spacing="2" fill="#e6a6fa" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle">ENEMY DUO</text>
<circle cx="1007" cy="210" r="25" fill="#563052" stroke="#ce89f1" stroke-width="2"/>
<circle cx="1087" cy="210" r="25" fill="#563052" stroke="#ce89f1" stroke-width="2"/>
<text x="1007" y="216" font-size="14" fill="#ffe9ff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">ADC</text>
<text x="1087" y="216" font-size="14" fill="#ffe9ff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">SUP</text>
<path d="M1007 252 L1007 266 M1087 252 L1087 266" stroke="#ce89f1" stroke-width="3" stroke-linecap="round"/>

name: Import showcase screenshots (one-time)
on:
  push:
    branches:
      - chore/showcase-screenshots-20261025
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organize screenshots and build gallery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          import unicodedata
          
          archive = Path("botdiff-showcase-ezreal-xerath-vs-jinx-thresh.zip")
          base = Path("assets/screenshots/ezreal-xerath-vs-jinx-thresh")
          extensions = {".png", ".jpg", ".jpeg", ".webp"}
          
          def slug(name):
              s = unicodedata.normalize("NFKD", name).encode("ascii", "ignore").decode().lower()
              return re.sub(r"[^a-z0-9]+", "-", s).strip("-")[:55] or "screenshot"
          
          with ZipFile(archive) as z:
              items = [x for x in z.infolist() if not x.is_dir() and
                       not x.filename.startswith("__MACOSX/") and
                       not Path(x.filename).name.startswith(".") and
                       Path(x.filename).suffix.lower() in extensions]
              if not items or sum(x.file_size for x in items) > 60 * 1024 * 1024:
                  raise RuntimeError("No supported images, or images exceed safety limit")
              items.sort(key=lambda x: [int(s) if s.isdigit() else s.lower() for s in re.split(r"(\d+)", x.filename)])
              base.mkdir(parents=True, exist_ok=True)
              captures = []
              for i, entry in enumerate(items, 1):
                  if entry.file_size > 25 * 1024 * 1024:
                      raise RuntimeError("Oversized image")
                  ext = Path(entry.filename).suffix.lower()
                  data = z.read(entry)
                  magic = (data.startswith(b"\x89PNG\r\n\x1a\n") if ext == ".png"
                           else data.startswith(b"\xff\xd8\xff") if ext in (".jpg", ".jpeg")
                           else data[:4] == b"RIFF" and data[8:12] == b"WEBP")
                  if not magic:
                      raise RuntimeError("Not a valid supported image: " + entry.filename)
                  filename = f"{i:02d}-{slug(Path(entry.filename).stem)}{ext}"
                  (base / filename).write_bytes(data)
                  title = re.sub(r"^\d+[-_. ]*", "", Path(entry.filename).stem).replace("_", " ").replace("-", " ").strip()
                  if not title or title.lower() in {"screenshot", "screen", "capture", "image"}:
                      title = f"Capture {i}"
                  captures.append((filename, title))
                  print("Imported", entry.filename, "=>", base / filename, len(data), "bytes")
          
          gallery = ["# BotDiff — Screenshots / Captures d'écran", "",
                     "[← BotDiff](../README.md)", "",
                     "Real alpha example: **Ezreal + Xerath vs Jinx + Thresh**. / Exemple réel de l'alpha.",
                     "This is an illustrative matchup, not a promise of complete coverage or infallible advice.", ""]
          for i, (name, title) in enumerate(captures, 1):
              gallery.extend([f"## {i:02d} — {title}", "",
                              f"![BotDiff — {title}](../{base.as_posix()}/{name})", ""])
          gallery.extend(["---", "",
                          "BotDiff is independent of Riot Games. League of Legends rights remain with their respective owners.", ""])
          Path("docs/SCREENSHOTS.md").write_text("\n".join(gallery), encoding="utf-8")
          
          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          section = ["## See BotDiff in action", "",
                     "Real BotDiff alpha screenshots for **Ezreal + Xerath vs Jinx + Thresh**.",
                     "",
                     '<div align="center">', ""]
          for name, title in captures[:3]:
              src = f"{base.as_posix()}/{name}"
              section.append(f'<a href="{src}"><img src="{src}" alt="BotDiff — {title}" width="48%" /></a>')
          section += ["", "</div>", "",
                      f"**[Explore all {len(captures)} screenshots / Voir toutes les captures](docs/SCREENSHOTS.md)**", "", ""]
          anchor = "## How it works"
          if anchor not in readme:
              raise RuntimeError("README heading not found")
          readme = readme.replace(anchor, "\n".join(section) + anchor, 1)
          readme = readme.replace(
              "- **Share BotDiff:** [Short product description and talking points](docs/ABOUT.md)",
              "- **Share BotDiff:** [Short product description and talking points](docs/ABOUT.md)\n"
              "- **See BotDiff:** [Product screenshots](docs/SCREENSHOTS.md)")
          readme_path.write_text(readme, encoding="utf-8")
          
          about_path = Path("docs/ABOUT.md")
          about = about_path.read_text(encoding="utf-8").replace(
              "No third-party artwork, footage or user testimonials are included in this repository.",
              "Product screenshots depict the BotDiff interface and may include third-party League of Legends game imagery. Rights to that imagery belong to their respective owners. No user testimonials are included.")
          about_path.write_text(about, encoding="utf-8")
          
          notice_path = Path("NOTICE.md")
          notice = notice_path.read_text(encoding="utf-8")
          notice += "\nPublic product screenshots may contain League of Legends game imagery. Game artwork and trademarks remain the property of their respective rights holders; no permission to reuse them is granted here.\n"
          notice_path.write_text(notice, encoding="utf-8")
          print("Prepared", len(captures), "screenshots and updated public gallery and documentation.")
          PY
          rm botdiff-showcase-ezreal-xerath-vs-jinx-thresh.zip
          rm .github/workflows/import-showcase-screenshots.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: publish organized BotDiff alpha screenshots'
          git push origin "HEAD:$GITHUB_REF_NAME"
